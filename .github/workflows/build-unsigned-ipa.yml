name: Build Unsigned iOS IPA for TrollStore

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: 🔍 Debug - iOS Structure
        run: |
          cd ios
          echo "=== ios/ 文件列表 ==="
          ls -la
          echo "=== xcworkspace ==="
          ls -la *.xcworkspace 2>/dev/null || echo "No xcworkspace"

      - name: Build Archive
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          
          echo "Using workspace: $WORKSPACE"
          echo "Using scheme: $SCHEME"
          
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphoneos \
            -archivePath ../build/sub2api-mobile.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            | xcpretty || echo "xcodebuild finished with warnings"

      - name: 🔍 Debug - Check Archive Output
        run: |
          echo "=== build/ 目录内容 ==="
          ls -la build/ 2>/dev/null || echo "build/ not found"
          echo "=== xcarchive 内容 ==="
          ls -la build/sub2api-mobile.xcarchive/ 2>/dev/null || echo "xcarchive not generated"
          ls -la build/sub2api-mobile.xcarchive/Products/Applications/ 2>/dev/null || echo "Applications/ not found"

      - name: Export Unsigned IPA
        run: |
          ARCHIVE_PATH="build/sub2api-mobile.xcarchive"
          if [ ! -d "$ARCHIVE_PATH" ]; then
            echo "❌ xcarchive not found! Check previous debug step."
            exit 1
          fi
          
          APP_PATH=$(find "$ARCHIVE_PATH/Products/Applications" -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ .app not found inside archive!"
            exit 1
          fi
          
          echo "Found app: $APP_PATH"
          
          cd build
          mkdir -p Payload
          cp -r "${APP_PATH}" Payload/
          zip -r sub2api-mobile-unsigned.ipa Payload
          mv sub2api-mobile-unsigned.ipa $GITHUB_WORKSPACE/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: sub2api-mobile-unsigned-ipa
          path: sub2api-mobile-unsigned.ipa
          retention-days: 7