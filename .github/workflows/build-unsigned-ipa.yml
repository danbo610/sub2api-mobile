name: Build Unsigned iOS IPA for TrollStore

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: 🔍 Debug - Project Structure
        run: |
          cd ios
          ls -la

      - name: Build .app (Debug)
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          
          echo "Using workspace: $WORKSPACE"
          echo "Using scheme: $SCHEME"
          
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            ONLY_ACTIVE_ARCH=NO \
            | xcpretty || echo "Build completed with warnings"

      - name: 🔍 Debug - Find .app
        run: |
          echo "=== Searching for .app file ==="
          find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -10 || echo "No .app found"
          echo "=== ios/build folder ==="
          ls -la ios/build 2>/dev/null || echo "No ios/build"

      - name: Package Unsigned IPA
        run: |
          # 查找生成的 .app
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "sub2apimobile.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ Could not find .app! Trying alternative location..."
            APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ .app not found. Check debug logs."
            exit 1
          fi
          
          echo "✅ Found app: $APP_PATH"
          
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r sub2api-mobile-unsigned.ipa Payload
          
          echo "✅ IPA created successfully!"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: sub2api-mobile-unsigned-ipa
          path: sub2api-mobile-unsigned.ipa
          retention-days: 7