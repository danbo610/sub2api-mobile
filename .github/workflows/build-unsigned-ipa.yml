name: Build Unsigned iOS IPA (for TrollStore)

on:
  workflow_dispatch:  # 手动触发

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'  # 根据需要调整最新版本

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npx expo install expo-dev-client

      - name: Prebuild iOS
        run: |
          npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Get App Name
        id: appname
        run: |
          RAW_NAME=$(jq -r .name package.json)
          SAFE_NAME=$(echo $RAW_NAME | tr -cd '[:alnum:]_-')
          echo "APP_NAME=$SAFE_NAME" >> $GITHUB_ENV

      - name: Build Unsigned Archive
        run: |
          cd ios
          xcodebuild \
            -workspace ${{ env.APP_NAME }}.xcworkspace \
            -scheme ${{ env.APP_NAME }} \
            -configuration Debug \
            -sdk iphoneos \
            clean archive \
            -archivePath ../build/${{ env.APP_NAME }}.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual

      - name: Create Unsigned IPA
        run: |
          cd build/${{ env.APP_NAME }}.xcarchive/Products/Applications
          mkdir -p Payload
          cp -r *.app Payload/
          zip -r ${{ env.APP_NAME }}.ipa Payload
          mv ${{ env.APP_NAME }}.ipa $GITHUB_WORKSPACE/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-unsigned-ipa
          path: *.ipa
          retention-days: 7