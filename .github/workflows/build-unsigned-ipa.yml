name: Build Unsigned iOS IPA for TrollStore

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: 🔍 Debug - List iOS files (查看实际生成的 workspace 和 scheme)
        run: |
          ls -la ios/
          echo "=== .xcworkspace files ==="
          ls -la ios/*.xcworkspace 2>/dev/null || echo "No .xcworkspace found"
          echo "=== .xcodeproj files ==="
          ls -la ios/*.xcodeproj 2>/dev/null || echo "No .xcodeproj found"

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: 🔍 Debug - List after pod install
        run: |
          ls -la ios/

      - name: Build Unsigned IPA
        run: |
          cd ios
          # 自动获取 workspace 和 scheme 名称
          WORKSPACE=$(ls *.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          
          echo "Using workspace: $WORKSPACE"
          echo "Using scheme: $SCHEME"
          
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphoneos \
            -archivePath ../build/sub2api-mobile.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual

      - name: Export Unsigned IPA
        run: |
          cd build/sub2api-mobile.xcarchive/Products/Applications
          mkdir -p Payload
          cp -r *.app Payload/
          zip -r sub2api-mobile-unsigned.ipa Payload
          mv sub2api-mobile-unsigned.ipa $GITHUB_WORKSPACE/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: sub2api-mobile-unsigned-ipa
          path: sub2api-mobile-unsigned.ipa
          retention-days: 7